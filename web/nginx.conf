# Раздача фронта и проксирование API на один адрес.
#
# Почему один адрес, а не два: сессия лежит в cookie с SameSite=Lax, и на чужое
# происхождение браузер её не отправляет. Разводить фронт и API по разным портам
# — значит чинить это заголовками CORS и Secure-cookie там, где достаточно
# одного nginx. В облаке ту же роль играет балансировщик (infra/alb.tf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Имя службы из docker-compose.yml. Резолвер нужен, чтобы nginx не падал при
  # старте, если API поднимается вторым.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Фотографии акта идут через тот же путь и бывают тяжёлыми.
    client_max_body_size 25m;
  }

  # Проба живости и описание API — теми же путями, что у сервера.
  location = /health { proxy_pass http://server:3000/health; }
  location = /docs   { proxy_pass http://server:3000/docs; }

  # Собранные файлы versioned: имя меняется вместе с содержимым, поэтому кэш
  # длинный. Сам index.html — никогда: иначе после выкладки вкладка возьмёт старый.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
