# Всё приложение на машине разработчика: база, хранилище снимков, API и фронт.
#
#   docker compose up -d --build
#   http://localhost:8080          — CRM, вход sv / o2 / v0, пароль 1234
#   http://localhost:8080/?demo=1  — прежний прототип, без сервера и без базы
#   http://localhost:9001          — консоль MinIO, снимки актов
#
# В облаке места этих служб занимают Managed PostgreSQL, Object Storage,
# контейнер API на ВМ и раздача статики за балансировщиком (см. infra/).
# Версии держим теми же, чтобы расхождений в поведении между машиной и
# dev-контуром не было.
services:
  postgres:
    image: postgres:16-alpine
    container_name: uchetkin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uchetkin
      POSTGRES_USER: uchetkin
      POSTGRES_PASSWORD: uchetkin
      # Сортировка русских строк: улицы и города в списках должны идти по-русски.
      LANG: ru_RU.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uchetkin -d uchetkin"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Хранилище снимков акта. На машине разработчика это MinIO, в облаке —
  # Yandex Object Storage: код один, разница только в адресе и ключе
  # (server/src/storage.ts). Консоль MinIO — http://localhost:9001, вход
  # uchetkin / uchetkin-secret.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: uchetkin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: uchetkin
      MINIO_ROOT_PASSWORD: uchetkin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Бакет заводится один раз и тут же уходит: в облаке его создаёт Terraform
  # (infra/storage.tf), а на машине разработчика — вот этот разовый запуск.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: uchetkin-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 uchetkin uchetkin-secret &&
      mc mb --ignore-existing local/uchetkin-acts &&
      mc anonymous set none local/uchetkin-acts"

  # API. Поднимается после базы и только когда та отвечает: миграции и первый
  # же запрос идут в неё сразу, а не когда-нибудь потом.
  server:
    build: ./server
    container_name: uchetkin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://uchetkin:uchetkin@postgres:5432/uchetkin
      PORT: 3000
      # Хранилище снимков. Имена переменных те же, что пишет на ВМ cloud-init
      # (infra/cloud-init.yaml.tftpl): в облаке меняется только адрес, а ключ
      # приходит из Lockbox.
      S3_ENDPOINT: http://minio:9000
      ACTS_BUCKET: uchetkin-acts
      S3_ACCESS_KEY_ID: uchetkin
      S3_SECRET_ACCESS_KEY: uchetkin-secret
      # На машине разработчика ключ подписи сессий нужен только чтобы cookie
      # пережила перезапуск. В облаке он приходит из Lockbox (infra/lockbox.tf).
      SESSION_SECRET: dev-session-secret-uchetkin
      # Приёмник вебхуков без ключа отвечает 503 — так и задумано.
      NOVOFON_WEBHOOK_SECRET: dev-novofon-secret
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Фронт: собранные файлы за nginx, который проксирует /api и /health на API.
  # Один адрес на всё — иначе сессионная cookie (SameSite=Lax) до сервера не
  # доедет, а слой «нет связи» поднимется на ровном месте.
  web:
    build: ./web
    container_name: uchetkin-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio:
