# prod — только руками и только тем тегом, который уже проверен в dev.
# Реестр образов у prod свой (infra/registry.tf), поэтому выкладка сначала
# собирает в него образы того же коммита, чей SHA стоит в теге, — и только если
# их там ещё нет. При откате образы предыдущего релиза уже лежат в реестре,
# сборка пропускается, и этот же запуск с тегом предыдущего релиза и есть откат
# (docs/release.md).
#
# Подтверждение даёт окружение prod в настройках репозитория (Settings →
# Environments → prod → Required reviewers). Пока оно настроено, прогон
# останавливается перед выкладкой и ждёт, когда человек нажмёт «Approve».
name: Выкладка в prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образов — короткий SHA. Для отката укажите тег предыдущего релиза
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      tag: ${{ inputs.tag }}
      build: true
    secrets: inherit
