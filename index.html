<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM «Учёткин»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{
  --bg:#F2F2F0; --bg2:#ECECEA; --surface:#FAFAF8; --card:#FFFFFF;
  --border:#DCDCD7; --border2:#E6E6E2;
  --ink:#171717; --ink2:#575757; --ink3:#8D8D8D;
  --wash:rgba(23,23,23,.045); --mark:rgba(23,23,23,.22);
  --success:#16A34A; --error:#DC2626; --warning:#D97706; --cold:#2563EB;
  --btnA:#1B1B1B; --btnB:#343434; --btnFg:#F2F2F0;
  --gridA:rgba(23,23,23,.05); --gridB:rgba(23,23,23,.024);
  --glow:rgba(255,255,255,.6); --scan:rgba(23,23,23,.06);
  --shSoft:0 6px 18px -10px rgba(20,20,20,.16);
  --shCard:0 16px 32px -14px rgba(20,20,20,.2);
}
[data-theme="dark"]{
  --bg:#0A0A0A; --bg2:#101010; --surface:#141414; --card:#181818;
  --border:#252525; --border2:#1C1C1C;
  --ink:#E7E7E7; --ink2:#A0A0A0; --ink3:#6B6B6B;
  --wash:rgba(231,231,231,.05); --mark:rgba(231,231,231,.17);
  --success:#22C55E; --error:#EF4444; --warning:#F59E0B; --cold:#60A5FA;
  --btnA:rgba(236,236,236,.97); --btnB:#C9C9C9; --btnFg:#0B0B0B;
  --gridA:rgba(231,231,231,.025); --gridB:rgba(231,231,231,.012);
  --glow:rgba(231,231,231,.045); --scan:rgba(231,231,231,.07);
  --shSoft:0 6px 18px -8px rgba(0,0,0,.45);
  --shCard:0 16px 32px -12px rgba(0,0,0,.55);
}
:root{ --r:10px; --r-in:7px; --W:1400px; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 'SN Pro',ui-sans-serif,system-ui,sans-serif;overflow:hidden;transition:background .4s ease,color .4s ease}
::selection{background:var(--ink);color:var(--bg)}
::placeholder{color:var(--ink3)}
:focus-visible{outline:1px solid var(--ink3);outline-offset:2px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r)}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--mark)}
a:hover{color:var(--ink2)}
@keyframes wsFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes wsPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes wsPulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
@keyframes wsScan{0%{top:0;opacity:0}6%{opacity:1}94%{opacity:1}100%{top:100%;opacity:0}}
@keyframes wsBreath{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 22px -4px var(--mark)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5}

/* ---------- фон ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx-glow{background:radial-gradient(ellipse 75% 50% at 50% -14%,var(--glow) 0%,transparent 60%)}
.fx-grid{background-image:linear-gradient(var(--gridA) 1px,transparent 1px),linear-gradient(90deg,var(--gridA) 1px,transparent 1px),linear-gradient(var(--gridB) 1px,transparent 1px),linear-gradient(90deg,var(--gridB) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 95% 90% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 95% 90% at 50% 0%,#000 25%,transparent 80%)}
.fx-scan{position:fixed;left:0;right:0;height:1px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:wsScan 11s linear infinite}

/* ---------- интро ---------- */
#intro{position:fixed;inset:0;z-index:120;background:var(--bg);display:block}
#intro canvas{display:block;width:100%;height:100%}

/* ============ ПОЛЯ ============ */
.f{margin-bottom:12px;min-width:0}
.f > label{display:block;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.fld{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  font-size:13px;color:var(--ink);text-align:left;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
textarea.fld{height:auto;padding:9px 11px;resize:vertical;min-height:76px;line-height:1.5}
.fld:hover{border-color:var(--mark)}
.fld:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--wash)}
.fld.sm{height:32px;padding:0 9px;font-size:12px}
.sel{position:relative;min-width:0}
.sel .fld{cursor:pointer}
.sel.open > .fld{border-color:var(--ink);box-shadow:0 0 0 3px var(--wash)}
.sel .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel .v.ph{color:var(--ink3)}
.sel .cv{color:var(--ink3);flex-shrink:0;transition:transform .2s ease}
.sel.open .cv{transform:rotate(180deg)}
.pop{position:absolute;z-index:40;top:calc(100% + 5px);left:0;min-width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shCard);padding:5px;max-height:268px;overflow-y:auto;animation:wsPop .16s ease}
.pop.right{left:auto;right:0}
.o{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:var(--r-in);background:transparent;color:var(--ink2);font-size:12.5px;text-align:left;white-space:nowrap}
.o:hover{background:var(--wash);color:var(--ink)}
.o[aria-selected="true"]{color:var(--ink);font-weight:500}
.o .tail{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
.o .hint{font-size:10.5px;color:var(--ink3)}
.o .ck{opacity:0;color:var(--ink)}
.o[aria-selected="true"] .ck{opacity:1}
.chk{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.chk i{width:17px;height:17px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--r-in);background:var(--card);display:grid;place-items:center;transition:all .2s ease}
.chk i svg{width:11px;height:11px;opacity:0;transition:opacity .15s ease}
.chk:hover i{border-color:var(--mark)}
.chk[aria-checked="true"]{color:var(--ink)}
.chk[aria-checked="true"] i{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chk[aria-checked="true"] i svg{opacity:1}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.seg button{padding:6px 13px;border:0;border-radius:var(--r-in);background:transparent;color:var(--ink3);font-size:12px;transition:all .2s ease;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--shSoft)}
.opt{display:inline-flex;align-items:center;gap:8px;padding:0 13px;height:38px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--ink2);font-size:12.5px;transition:all .2s ease}
.opt:hover{border-color:var(--mark);color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--wash);color:var(--ink)}
.cal{width:250px;padding:10px}
.cal-h{display:flex;align-items:center;gap:5px;margin-bottom:9px}
.cal-h b{flex:1;text-align:center;font-size:12.5px}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px}
.cal-w span{text-align:center;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g button{height:28px;border:1px solid transparent;border-radius:var(--r-in);background:transparent;color:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.cal-g button:hover{background:var(--wash);color:var(--ink)}
.cal-g button.out{color:var(--border)}
.cal-g button.tdy{border-color:var(--border)}
.cal-g button.on{background:var(--ink);color:var(--bg)}

/* ---------- кнопки ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 15px;height:38px;border:none;border-radius:var(--r);
  background:linear-gradient(180deg,var(--btnA),var(--btnB));color:var(--btnFg);font-size:12.5px;font-weight:600;box-shadow:var(--shSoft);transition:all .25s ease}
.b:hover{transform:translateY(-1px);box-shadow:0 8px 22px -8px var(--mark)}
.b:disabled{opacity:.35;transform:none;box-shadow:none;cursor:not-allowed}
.b.wide{width:100%}
.b.sm{height:30px;font-size:11.5px;padding:0 12px}
.g{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;height:38px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--ink2);font-size:11.5px;transition:all .25s ease}
.g:hover{color:var(--ink);border-color:var(--mark)}
.g.sm{height:30px;padding:0 11px;font-size:11px}
.g:disabled{opacity:.35;cursor:not-allowed;color:var(--ink2);border-color:var(--border)}
.ib{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;transition:all .25s ease;flex-shrink:0}
.ib.sm{width:28px;height:28px;border-radius:var(--r-in)}
.ib:hover{color:var(--ink);border-color:var(--mark)}
.ib:disabled{opacity:.3;cursor:not-allowed}
.ib.ok:hover{color:var(--success)} .ib.no:hover{color:var(--error)} .ib.wr:hover{color:var(--warning)}

/* ---------- каркас 1400 ---------- */
.stage{position:relative;z-index:2;height:100vh;display:flex;justify-content:center}
.app{display:flex;width:100%;max-width:var(--W);height:100vh;overflow:hidden;border-left:1px solid var(--border2);border-right:1px solid var(--border2)}
.rail{width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0 16px;border-right:1px solid var(--border2);position:relative;z-index:5;gap:6px}
.rail .logo{width:38px;height:38px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:14px;animation:wsBreath 5s ease-in-out infinite}
.nb{position:relative;width:40px;height:40px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;transition:all .25s ease}
.nb:hover{color:var(--ink);background:var(--wash)}
.nb[aria-current="true"]{color:var(--ink);background:var(--wash);border-color:var(--border)}
.nb .bdg{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-in);background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.ava{position:relative;width:36px;height:36px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.04em}
.ava i{position:absolute;bottom:-2px;right:-2px;width:9px;height:9px;border-radius:3px;background:var(--success);border:2px solid var(--bg)}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border2)}
.hd .ttl{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.hd .ttl b{font-size:14.5px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:9.5px;font-weight:500;letter-spacing:.13em;color:var(--ink3);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:2px;background:var(--success);animation:wsPulse 2.2s ease-in-out infinite}

.body{flex:1;min-height:0;display:flex;animation:wsFade .3s ease}
.side{width:250px;flex-shrink:0;border-right:1px solid var(--border2);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side .sb{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:var(--r);background:transparent;color:var(--ink2);font-size:12.5px;text-align:left;transition:all .2s ease}
.side .sb:hover{background:var(--wash);color:var(--ink)}
.side .sb[aria-current="true"]{background:var(--wash);color:var(--ink);border-color:var(--border)}
.side .sb .n{margin-left:auto;font-size:10.5px;color:var(--ink3);flex-shrink:0;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0;overflow-y:auto;padding:18px 20px 44px}
.cap{font-size:12px;color:var(--ink3);line-height:1.5;margin:0 0 14px;max-width:78ch}

/* ---------- карточки ---------- */
.c{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.c > h3{font-size:14px;margin-bottom:4px}
.c > h3 + .cap{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .f{margin-bottom:0}

/* ---------- лента ёмкости ---------- */
.rib{display:flex;gap:4px;align-items:flex-end}
.rib4{display:flex;flex-direction:column;gap:9px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk.wkd{margin-bottom:-4px}
.wk.wkd span{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-left:2px}
.wkh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.wkh .lbl{letter-spacing:.14em}
.wkh .rg{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wkh .now{color:var(--cold)}
.wkh .tot{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rib4 .day{min-width:0}
.rib4 .day .bar{height:46px}
.rib4 .day .pct{top:4px;font-size:10px}
.rib4 .day .dd{margin-top:4px}
.rib4 .day.past{opacity:.42}
.rib4 .day.tdy .dd{color:var(--cold);font-weight:600}
.rib4 .day .cts{font-size:9.5px;color:var(--ink3);margin-top:2px;line-height:1.3;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.rib4 .day[aria-pressed="true"] .cts{color:var(--ink2)}
.day{flex:1 0 0;min-width:42px;background:none;border:0;padding:0}
.day .bar{height:94px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);position:relative;overflow:hidden;transition:all .2s ease}
.day .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ink3);opacity:.3;transition:height .3s ease}
.day[data-s="fill"] .fill{background:var(--cold);opacity:.45}
.day[data-s="full"] .fill{background:var(--ink);opacity:.72}
.day[data-s="over"] .fill{background:var(--error);opacity:.6}
.day .bar::after{content:"";position:absolute;left:0;right:0;bottom:90.9%;border-top:1px dashed var(--mark);opacity:.5}
.day .pct{position:absolute;left:0;right:0;top:6px;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .dd{font-size:10.5px;margin-top:6px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .wd{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.day:hover .bar{border-color:var(--mark)}
.day[aria-pressed="true"] .bar{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lg{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:11px;color:var(--ink3)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- календарь плана ---------- */
.ptop{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ptop b{font-size:15px;min-width:150px;text-align:center}
.phead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.phead span{font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-left:2px}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pd{display:flex;flex-direction:column;gap:7px;text-align:left;min-height:106px;padding:9px 10px 10px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--card);transition:all .2s ease}
.pd.wknd{background:var(--bg2)}
.pd.out{opacity:.35}
.pd:hover{border-color:var(--mark)}
.pd[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pd .h{display:flex;align-items:baseline;gap:6px}
.pd .dn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pd.tdy .dn{color:var(--cold)}
.pd .cr{margin-left:auto;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pd .big{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.pd .big em{font-style:normal;font-size:10px;font-weight:400;margin-left:auto}
.pd .pb{height:5px;border-radius:3px;background:var(--wash);position:relative;overflow:hidden}
.pd .pb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3);opacity:.4;border-radius:3px}
.pd[data-s="fill"] .pb i{background:var(--cold);opacity:.55}
.pd[data-s="full"] .pb i{background:var(--ink);opacity:.75}
.pd[data-s="over"] .pb i{background:var(--error);opacity:.7}
.pd .pb s{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--mark);text-decoration:none}
.pd .cs{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pd .off{font-size:10.5px;color:var(--ink3)}

/* ---------- таблицы ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border2);color:var(--ink2)}
tbody tr:hover td{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td b{color:var(--ink);font-weight:600}
.tg{display:inline-flex;align-items:center;padding:2px 9px;border:1px solid currentColor;border-radius:var(--r-in);font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.t-ok{color:var(--success)} .t-warn{color:var(--warning)} .t-err{color:var(--error)}
.t-cold{color:var(--cold)} .t-ink{color:var(--ink)} .t-mut{color:var(--ink3)}
.empty{padding:34px 10px;text-align:center;color:var(--ink3);font-size:12.5px}

/* ---------- маршрут ---------- */
.tl{display:flex;height:26px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card);margin:12px 0}
.tl div{flex:1;border-right:1px solid var(--border2);font-size:9.5px;line-height:24px;text-align:center;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl div:last-child{border-right:0}
.tl div.busy{background:var(--wash);color:var(--ink)}
.tl div.done{background:var(--ink);color:var(--bg)}
.stops{max-height:320px;overflow-y:auto}
.stop{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border2);font-size:12.5px}
.stop:last-child{border-bottom:0}
.stop.sel{background:var(--wash);border-radius:var(--r-in);box-shadow:inset 2px 0 0 var(--ink);padding-left:9px}

.stop small{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.stop.fin b{color:var(--ink3);text-decoration:line-through}
.stamp{position:absolute;right:18px;bottom:16px;width:88px;height:88px;border:1.5px solid var(--mark);border-radius:50%;color:var(--ink3);display:grid;place-content:center;text-align:center;transform:rotate(-11deg);opacity:.6;pointer-events:none}
.stamp::after{content:"";position:absolute;inset:5px;border:1px dashed var(--mark);border-radius:50%}
.stamp b{font-size:10px;font-weight:600;letter-spacing:.16em;display:block;color:var(--ink2)}
.stamp span{font-size:9px;display:block;margin-top:3px}

/* ---------- прочее ---------- */
.chat{border:1px solid var(--border);border-radius:var(--r);background:var(--card);height:236px;overflow-y:auto;padding:12px}
.msg{margin-bottom:11px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.msg b{font-size:12px;color:var(--ink)}
.msg small{font-size:10px;color:var(--ink3);margin-left:6px}
.msg.v{padding-left:9px;border-left:2px solid var(--border)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:14px}
.kpi > div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .k{font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:5px;line-height:1.4}
.toast{position:fixed;right:22px;bottom:22px;background:var(--card);border:1px solid var(--border);border-left:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;font-size:12.5px;z-index:60;max-width:390px;box-shadow:var(--shCard);animation:wsFade .25s ease}

.login-wrap{position:relative;z-index:2;height:100vh;display:grid;place-items:center;padding:24px}

/* ---------- рельса: группы по ролям ---------- */
.rail .nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding-bottom:6px}

  border:1px solid var(--border);border-radius:var(--r-in);background:var(--surface);color:var(--ink2);font-size:10.5px;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:all .2s ease}

.chkbox{display:flex;align-items:center;height:38px;padding:0 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);transition:border-color .2s ease}

.opbar{display:flex;align-items:stretch;gap:0;border:1px solid var(--border);border-radius:var(--r);

@keyframes opRing{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,0)}50%{box-shadow:0 0 0 4px rgba(217,119,6,.22)}}

/* ---------- мини-окно звонка ---------- */

.wrow{border:1px solid var(--border2);border-radius:var(--r);background:var(--card);padding:11px 12px;margin-bottom:8px}

.phw{position:relative;width:58px;height:44px;flex-shrink:0}

.phw .x{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--ink3);display:grid;place-items:center;opacity:0;transition:all .18s ease}
.phw:hover .x{opacity:1}
.phw .x:hover{color:var(--error);border-color:var(--error)}
.addph{cursor:pointer}
.nophoto{font-size:10.5px;color:var(--error)}
.actnote{padding:10px 12px;border:1px solid var(--border2);border-left:2px solid var(--warning);border-radius:var(--r);
  background:var(--card);font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.actnote b{display:block;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}

/* ---------- поддержка маршрутов: шкала дня ---------- */
.rrow{display:flex;align-items:center;gap:4px}
.rrow .sb{flex:1;min-width:0}
.rrow .ib{flex-shrink:0;position:relative}
.rrow .ib .cnt{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;padding:0 3px;border-radius:5px;
  background:var(--ink);color:var(--bg);font-size:8.5px;font-weight:600;display:grid;place-items:center}
.tlg{display:flex;flex-direction:column;margin-top:4px}
.tlh{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:stretch;min-height:42px}
.tlh .hh{position:relative;padding:8px 12px 0 0;font-size:11.5px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.tlh .hh i{position:absolute;right:0;top:14px;bottom:-1px;width:1px;background:var(--border)}
.tlh:last-child .hh i{display:none}
.tlh.now .hh{color:var(--cold);font-weight:600}
.tlh.now .hh i{background:var(--cold);width:1.5px}
.tlh .lane{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 8px;border-top:1px dashed var(--border2);align-items:center}
.tlh:first-child .lane{border-top:0}
.tlh .lane.empty{padding:4px 0}
.tlh .lane .none{font-size:10.5px;color:var(--border);letter-spacing:.05em}
.chip2{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 10px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--card);min-width:300px;transition:border-color .2s ease,box-shadow .2s ease}
.chip2:hover{border-color:var(--mark);box-shadow:var(--shSoft)}
.chip2.fin{opacity:.55}
.chip2.fin .ad b{text-decoration:line-through}
.chip2 .rt{font-size:9.5px;color:var(--ink3);flex-shrink:0}
.chip2 .ad{min-width:0;flex:1}
.chip2 .ad b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip2 .ad small{display:block;font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip2 .ctl{display:flex;align-items:center;gap:4px;flex-shrink:0}

/* ---------- календарь планирования ---------- */
.pcell{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;padding:8px 9px 9px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--card);transition:all .2s ease}
.pcell.out{opacity:.32}
.pcell.off{background:var(--bg2)}
.pcell:hover{border-color:var(--ink);box-shadow:var(--shSoft)}
.pcell .h{display:flex;align-items:baseline;gap:6px}
.pcell .dn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pcell.tdy .dn{color:var(--cold)}
.pcell .cr{margin-left:auto;font-size:10px;color:var(--ink3)}
.pcell .pb{height:4px;border-radius:3px;background:var(--wash);position:relative;overflow:hidden}
.pcell .pb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3);opacity:.4;border-radius:3px}
.pcell[data-s="fill"] .pb i{background:var(--cold);opacity:.55}
.pcell[data-s="full"] .pb i{background:var(--ink);opacity:.75}
.pcell[data-s="over"] .pb i{background:var(--error);opacity:.7}
.pcell .pb s{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--mark);text-decoration:none}
.pcell .tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{display:inline-flex;align-items:center;padding:1px 6px;border:1px solid var(--border);border-radius:var(--r-in);
  background:var(--surface);font-size:9.5px;font-style:normal;color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.tag.more{color:var(--ink3)}
.tag.empty{border-style:dashed;color:var(--ink3)}
.pcell .crew{display:flex;gap:8px;margin-top:auto;align-items:center;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pcell .crew i{display:inline-flex;align-items:center;gap:3px;font-style:normal}
.pcell .crew i.none{color:var(--warning)}
.tgls{display:flex;flex-wrap:wrap;gap:5px;max-height:168px;overflow-y:auto;padding:1px}
.tgl{padding:5px 10px;border:1px solid var(--border);border-radius:var(--r-in);background:var(--card);

.tgl[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.tgl.ab{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.g.end{border-color:var(--error);color:var(--error)}
.g.end:hover{background:var(--error);color:var(--bg);border-color:var(--error)}

.mlg .d2{fill:var(--ink)}

.mp{cursor:pointer}
.mp .hit{fill:transparent}
.mp .dot{fill:var(--cold);opacity:.6;transition:all .15s ease}
.mp:hover .dot{opacity:1;r:6}
.mp.on .dot{fill:var(--ink);opacity:1}
.mp.on text{font-size:10px;font-weight:600;fill:var(--ink)}
.mp.taken{cursor:default}
.mp.taken .dot{fill:var(--ink3);opacity:.22}
.mp.taken:hover .dot{opacity:.3}
.rclist{max-height:620px;overflow-y:auto;padding-right:2px}
.rcr{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:10px 11px;margin-bottom:8px}
.rch{display:flex;align-items:center;gap:8px}
.rch .note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcs{margin-top:8px;max-height:132px;overflow-y:auto}
.rcs > div{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--border2)}
.rcs > div:last-child{border-bottom:0}
.rcs .n{color:var(--ink3);font-size:10px;flex-shrink:0}
.rcs .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- модальный слой ---------- */
.mask{position:fixed;inset:0;z-index:90;padding:36px 22px;overflow-y:auto;
  background:rgba(12,12,12,.4);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:flex;justify-content:center;align-items:flex-start;animation:wsFade .2s ease}
[data-theme="dark"] .mask{background:rgba(0,0,0,.6)}
.modal{width:min(1120px,96vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.55);padding:18px 20px 20px;animation:wsPop .2s ease}
.mhd{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border2)}
.mhd h3{font-size:15px}
.mhd .note{flex:1}
.mhd .ib{flex-shrink:0}

/* ---------- просмотр фото ---------- */
.lb{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:40px;animation:wsFade .2s ease}
.lb img{max-width:min(880px,86vw);max-height:76vh;border-radius:var(--r);display:block;box-shadow:0 30px 70px -20px #000}
.lb .bar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;color:#E7E7E7;font-size:12px}
.lb .bar .ib{border-color:rgba(231,231,231,.28);color:#E7E7E7}
.lb .bar .ib:hover{border-color:#E7E7E7}
.lb .cls{position:absolute;top:22px;right:22px}

/* ──────────────────────────────────────────────────────────
   ИНТРО: отрисовка счётчика на canvas
   ────────────────────────────────────────────────────────── */
const INTRO = (()=>{
  const TLN = {
    pipesL:{at:0,dur:340}, body:{at:170,dur:760}, pipesR:{at:520,dur:340},
    bar:{at:820,dur:260}, pills:{at:940,dur:560}, dial:{at:1420,dur:400},
    dot:{at:1600,dur:320}, roll:{at:1780,dur:1250}, title:{at:2050,dur:520},
    dock:{at:3150,dur:820}
  };
  const END = 3970;
  const E = {out:t=>1-Math.pow(1-t,3), out4:t=>1-Math.pow(1-t,4), io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

  let cv, ctx, W=0, H=0, dpr=1, T=0, raf=0, shapes={}, done=false, onEnd=null;
  const DIGITS = [0,0,7,4,2];

  function measure(d){
    const NS='http://www.w3.org/2000/svg';
    const s=document.createElementNS(NS,'svg'); s.setAttribute('width','0'); s.setAttribute('height','0');
    s.style.cssText='position:absolute;left:-9999px;opacity:0;pointer-events:none';
    const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); s.appendChild(p);
    document.body.appendChild(s); const len=p.getTotalLength(); s.remove();
    return {p:new Path2D(d), len};
  }
  function pillPath(cx,top,bot,w){
    const r=w/2, P=new Path2D();
    P.moveTo(cx-r,top); P.arc(cx,top,r,Math.PI,0); P.lineTo(cx+r,bot);
    P.arc(cx,bot,r,0,Math.PI); P.closePath(); return P;
  }
  function build(){
    ['circle','pipeLT','pipeLB','pipeRT','pipeRB','bar','dial','dot'].forEach(k=>shapes[k]=measure(M[k]));
    shapes.pills = M.pills.map(x=>pillPath(x,M.pillTop,M.pillBot,M.pillW));
  }
  const pr=(k,e)=>{const s=TLN[k]; const p=clamp((T-s.at)/s.dur,0,1); return e?e(p):p;};
  function line(sh,p,col,w){
    if(p<=0) return;
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
    if(p<1) ctx.setLineDash([sh.len*E.out(p), sh.len]);
    ctx.stroke(sh.p); ctx.restore();
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  }
  function frame(ts){
    if(!frame.t0) frame.t0=ts;
    T=(ts-frame.t0);
    draw();
    if(T<END+380) raf=requestAnimationFrame(frame); else finish();
  }
  function finish(){
    if(done) return; done=true; cancelAnimationFrame(raf);
    const el=document.getElementById('intro');
    if(el){ el.style.transition='opacity .35s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),380); }
    const card=document.querySelector('.login');
    if(card){ card.style.transition='opacity .45s ease, transform .45s ease'; card.style.opacity='1'; card.style.transform='none'; }
    onEnd&&onEnd();
  }
  function target(){
    const t=document.querySelector('.login .logo');
    if(!t) return null;
    const r=t.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2, s:(r.width*0.62)/512};
  }
  function draw(){
    const cs=getComputedStyle(document.documentElement);
    const bg=cs.getPropertyValue('--bg').trim()||'#F2F2F0';
    const ink=cs.getPropertyValue('--ink').trim()||'#171717';
    const ink3=cs.getPropertyValue('--ink3').trim()||'#8D8D8D';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    /* позиция и масштаб сцены: центр → док в плитку логотипа */
    const base=Math.min(W,H)*0.30/512;
    let cx=W/2, cy=H/2-26, sc=base, alpha=1;
    const dk=pr('dock',E.io);
    if(dk>0){
      const t=target();
      if(t){ cx=lerp(cx,t.x,dk); cy=lerp(cy,t.y,dk); sc=lerp(base,t.s,dk); }
      alpha=1-clamp((dk-0.55)/0.45,0,1);
    }
    ctx.globalAlpha=alpha;
    ctx.setTransform(dpr*sc,0,0,dpr*sc, dpr*(cx-256*sc), dpr*(cy-256*sc));

    const pL=pr('pipesL'), pB=pr('body'), pR=pr('pipesR'), pBar=pr('bar');
    line(shapes.pipeLT,pL,ink,M.sw); line(shapes.pipeLB,clamp(pL*1.15-0.12,0,1),ink,M.sw);
    line(shapes.circle,pB,ink,M.sw);
    line(shapes.pipeRT,pR,ink,M.sw); line(shapes.pipeRB,clamp(pR*1.15-0.12,0,1),ink,M.sw);
    line(shapes.bar,pBar,ink,M.sw);

    /* ролики: раскрываются сверху вниз со сдвигом */
    const pp=pr('pills');
    shapes.pills.forEach((path,i)=>{
      const k=clamp(pp*5 - i*0.62, 0, 1); if(k<=0) return;
      const e=E.out4(k), midY=(M.pillTop+M.pillBot)/2, h=(M.pillBot-M.pillTop)/2*e;
      ctx.save(); ctx.fillStyle=ink;
      ctx.fill(pillPath(M.pills[i], midY-h, midY+h, M.pillW));
      ctx.restore();
    });

    /* цифры в роликах — «прокрутка» и остановка слева направо */
    const rl=pr('roll');
    if(rl>0 && pp>=1){
      ctx.save(); ctx.fillStyle=bg; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='600 30px "SN Pro", sans-serif';
      const cellH=40, midY=(M.pillTop+M.pillBot)/2+1;
      M.pills.forEach((x,i)=>{
        const k=clamp(rl*1.9 - i*0.16, 0, 1);
        const spins=5+i*1.4, off=(1-E.out4(k))*spins*cellH*10;
        ctx.save();
        ctx.beginPath(); ctx.rect(x-M.pillW/2, M.pillTop-M.pillW/2+3, M.pillW, (M.pillBot-M.pillTop)+M.pillW-6); ctx.clip();
        for(let j=-1;j<=1;j++){
          const raw=DIGITS[i]+Math.round(off/cellH)+j;
          const y=midY + j*cellH - (off%cellH);
          ctx.fillText(String(((raw%10)+10)%10), x, y);
        }
        ctx.restore();
      });
      ctx.restore();
    }

    line(shapes.dial,pr('dial'),ink,M.sw);
    line(shapes.dot,pr('dot'),ink,M.sw);

    /* стрелка в большом циферблате — крутится, пока идут ролики */
    if(pr('dial')>=1){
      const spin=clamp((T-TLN.dial.at-TLN.dial.dur)/1500,0,1);
      const a=-Math.PI/2 + E.io(spin)*Math.PI*4.6;
      ctx.save(); ctx.strokeStyle=ink3; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(307.5,315.5);
      ctx.lineTo(307.5+Math.cos(a)*17, 315.5+Math.sin(a)*17); ctx.stroke(); ctx.restore();
    }

    /* подпись */
    const tt=pr('title',E.out);
    if(tt>0 && dk<0.25){
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.save(); ctx.globalAlpha=alpha*tt*(1-clamp(dk/0.25,0,1));
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=ink;
      ctx.font='600 26px "SN Pro", sans-serif';
      ctx.fillText('CRM «Учёткин»', W/2, H/2 + Math.min(W,H)*0.20 + 22 + (1-tt)*8);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  function skip(){ if(!done){ T=END; draw(); finish(); } }
  function start(cb){
    onEnd=cb;
    cv=document.getElementById('introCv'); if(!cv){cb&&cb();return;}
    ctx=cv.getContext('2d');
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){ skip(); return; }
    build(); resize(); addEventListener('resize',resize);
    document.getElementById('intro').addEventListener('click',skip);
    addEventListener('keydown',e=>{ if(e.key==='Escape'||e.key===' ') skip(); },{once:true});
    raf=requestAnimationFrame(frame);
  }
  return {start, skip};
})();

  S.staff.push({id:'sv',name:'Панченко И.',role:'supervisor',pattern:'5/2',anchor:TODAY,extra:[],ext:'100'});

    {id:'A1',staff:'v4',from:iso(addDays(today,4)),to:iso(addDays(today,6)),reason:'Поездка к родителям, ремонт крыши',status:'на согласовании',comment:''},
    {id:'A2',staff:'v7',from:iso(addDays(today,8)),to:iso(addDays(today,9)),reason:'Плановый медосмотр',status:'на согласовании',comment:''},
    {id:'A3',staff:'v1',from:iso(addDays(today,2)),to:iso(addDays(today,3)),reason:'Семейные обстоятельства',status:'согласовано',comment:'Подменит Ложкин'},
    {id:'A4',staff:'v9',from:iso(addDays(today,-4)),to:iso(addDays(today,-3)),reason:'Больничный',status:'согласовано',comment:''},
    {id:'A5',staff:'v5',from:iso(addDays(today,1)),to:iso(addDays(today,5)),reason:'Отпуск за свой счёт',status:'отклонено',comment:'Пик набора, перенесите на конец месяца'},
    {id:'A6',staff:'v0',from:iso(addDays(today,11)),to:iso(addDays(today,12)),reason:'Личные дела',status:'на согласовании',comment:''}
  ];
  /* День планирует руководитель: города приёма, смена поверителей и операторов, план. */
  const vers = S.staff.filter(p=>p.role==='verifier').map(p=>p.id);
  const opIds = S.staff.filter(p=>p.role==='operator'||p.role==='senior').map(p=>p.id);
  for(let i=-25;i<36;i++){
    const ds = iso(addDays(today,i));
    const wknd = [0,6].includes(new Date(ds+'T00:00:00').getDay());
    const n = wknd?rint(4,6):rint(7,11);
    const pool = [...vers], crew = [];
    for(let k=0;k<n;k++) crew.push(pool.splice(Math.floor(rr()*pool.length),1)[0]);
    const ops = opIds.filter((_,k)=>k<(wknd?2:3));
    const cities = [];
    if(rr()<.45) cities.push(rnd(BIG));
    else { const sp=[...SMALL]; for(let k=0,m=rint(2,4);k<m;k++) cities.push(sp.splice(Math.floor(rr()*sp.length),1)[0]); }
    S.days.push({date:ds,cities,crew:crew.sort(),ops,planned:crew.length*25});
  }
  const clients = ['Смирнова Т. А.','Волков Р. П.','Гареев И. М.','Дьяконова Л. С.','ООО «Стройсервис»',
    'Пшеничников А. А.','ТСЖ «Восход»','Кириллова Н. В.','Абрамов Д. Ю.','ООО «Гарант-Плюс»',

  const ops = S.staff.filter(s=>s.role==='operator'||s.role==='senior');
  let oi = 0;
  for(let i=-14;i<14;i++){
    const ds = iso(addDays(today,i));
    const rate = i<0?0.98 : i===0?.95 : i===1?.8 : i<4?.5 : i<7?.25 : .06;
    const cs = dayCities(ds); if(!cs.length) continue;
    const n = Math.round(planFor(ds)*rate*(.85+rr()*.3));
    for(let k=0;k<n;k++){
      const r = mkReq(ds,cs[k%cs.length],clients);
      r.operator = ops[oi++%ops.length].id; S.requests.push(r);
    }
  }
  for(let i=-14;i<=1;i++){
    const ds = iso(addDays(today,i));
    dayCities(ds).forEach(c=>{
      const crew = crewOn(ds);
      build(ds,c).forEach((rt,k)=>{
        rt.verifier = crew.length ? crew[(k+i+19)%crew.length].id : null;
        if(i<0) finishRoute(rt);
        else if(i===0){
          if(k===0) finishRoute(rt);
          else if(k===1){ callAll(rt); rt.status='в работе'; rt.duty=ops[1].id;
            rt.stops.forEach((s,j)=>{ if(j<Math.floor(rt.stops.length*.6) && s.called==='подтверждена') doneStop(rt,s); }); }
          else if(k===2){ callAll(rt); rt.status='обзвонен'; rt.duty=ops[0].id; }
          else rt.stops.forEach((s,j)=>{ if(j<Math.floor(rt.stops.length*.4)) s.called='подтверждена'; });

  /* Свежие звонки этого дня: приняты, но в маршрут ещё не поставлены. */

    for(let k=0;k<rint(2,4);k++){
      const r = mkReq(TODAY,c,clients);
      r.created = TODAY; r.operator = ops[oi++%ops.length].id;
      r.time = rint(12,20); r.routeId = null; r.status = 'создана';
      S.requests.push(r);

    [['v','Задерживаюсь на 40 минут, пробка на Малышева'],['o','Обзвонила три последние точки, перенесли окно'],['v','Спасибо']],
    [['v','Клиент хочет заодно замену на горячей. Считать?'],['o','Да, добавила услугу в заявку, цена 2600']]
  ];
  S.routes.filter(r=>r.date===TODAY||r.date===iso(addDays(today,-1))).slice(0,4).forEach((rt,i)=>{
    const v = nameOf(rt.verifier), o = nameOf(rt.duty||ops[0].id);
    rt.chat = chats[i%chats.length].map(([who,txt],j)=>({who:who==='v'?v:o,vf:who==='v',txt,t:pad(9+j*2)+':'+pad(rint(10,55))}));
    if(!rt.duty) rt.duty = ops[i%ops.length].id;
  });
}

  'Домофон не работает — звонить на подъезд','Пожилой клиент, стучать громче','Пломба УК сорвана — снять на фото',

const CONTACTS = ['','','Муж, Сергей','Дочь, Ольга','Сын, Дмитрий','Сосед, Пётр','Секретарь, Анна',
  'Бухгалтер, Ирина','Завхоз, Николай','Председатель, Тамара'];
function mkReq(ds,city,clients){
  const nm = rnd(clients), isU = /^(ООО|ТСЖ|ТСН)/.test(nm);
  const svc = rr()<.7?'wv' : rr()<.55?'wr' : rnd(['hv','hm','hd']);
  const heat = svc[0]==='h';
  const back = rint(0,6);
  let cr = iso(addDays(new Date(ds+'T00:00:00'),-back));
  /* Заявку на будущую дату приняли раньше — раскидываем по прошедшей неделе,
     иначе весь будущий набор схлопнется в сегодня. */
  if(cr>TODAY) cr = iso(addDays(today,-rint(0,6)));
  const ph2 = rr()<.35;
  return {id:'R'+(++S.seq),date:ds,created:cr>TODAY?TODAY:cr,city,clientType:isU?'Юрлицо':'Физлицо',name:nm,
    inn:isU?String(rint(6600000000,6699999999)):'',
    phone:randPhone(),
    contact:isU?'Секретарь, Анна':rnd(CONTACTS),
    phone2:ph2?randPhone():'',
    contact2:ph2?rnd(CONTACTS):'',
    street:rnd(STREETS),house:String(rint(1,120)),entrance:String(rint(1,6)),floor:String(rint(1,16)),
    flat:isU?'':String(rint(1,240)),intercom:rr()<.78,time:rint(10,20),
    cmtOp:rnd(CMT_OP),cmtVf:rnd(CMT_VF),
    services:[],devices:[],status:'создана',routeId:null,operator:null,from:null,
    expect:{svc,heat,nd:heat?1:rint(1,2)}};
}
/* Фото выполненных работ в демо-данных — заглушка вместо снимка с телефона. */
function stubPhoto(t1,t2){

    `<g stroke="#6b6b6b" fill="none" stroke-width="3"><circle cx="240" cy="168" r="86"/><circle cx="240" cy="168" r="62"/>`+
    `<path d="M40 140h114M40 200h108M326 140h114M332 200h108"/></g>`+
    `<text x="240" y="176" font-family="monospace" font-size="30" fill="#c9c9c9" text-anchor="middle">${t1}</text>`+
    `<text x="24" y="336" font-family="monospace" font-size="20" fill="#8d8d8d">${t2}</text></svg>`);
}
/* Акт материализуется в момент выполнения: приборы, услуга в строке прибора, фото. */
function actFor(r,ds){
  const {svc,heat,nd} = r.expect || {svc:'wv',heat:false,nd:1};
  r.devices = Array.from({length:nd},(_,j)=>{
    const t = heat?DEV_TYPES[5]:rnd(DEV_TYPES.slice(0,5));
    const sv = (j===1 && !heat && rr()<.3) ? 'wr' : svc;
    const serial = rint(10,99)+'-'+rint(100000,999999);
    return {svc:sv,type:t.v,grsi:t.grsi,carrier:heat?'Тепло':(j===0?'ХВС':'ГВС'),
      serial,room:rnd(ROOMS),seal:rr()<.86,
      photos:Array.from({length:rint(1,3)},(_,k)=>({src:stubPhoto(serial,ru(ds)+' · кадр '+(k+1)),
        name:'IMG_'+rint(1000,9999)+'.jpg',t:pad(rint(9,20))+':'+pad(rint(10,59))}))};
  });
  r.services = [...new Set(r.devices.map(d=>d.svc))];
}
function callAll(rt){ rt.stops.forEach(s=>{ if(!s.called) s.called = rr()<.9?'подтверждена':(rr()<.6?'перенос':'отказ'); }); }
function doneStop(rt,s){
  const r = S.requests.find(x=>x.id===s.req); if(!r) return;
  actFor(r,rt.date); s.done=true; r.status='выполнена'; r.verifier=rt.verifier;
}
function finishRoute(rt){
  callAll(rt); rt.status='выполнен';
  rt.stops.forEach(s=>{ const r=S.requests.find(x=>x.id===s.req); if(!r) return;
    if(s.called==='подтверждена') doneStop(rt,s);
    else r.status = s.called==='отказ'?'отменена':'перенос'; });
}

/* ---------- расчёты ---------- */
function absentOn(id,ds){ return S.absences.some(a=>a.staff===id&&a.status==='согласовано'&&ds>=a.from&&ds<=a.to); }
/* Смена — это назначение руководителя на конкретную дату минус согласованные отсутствия. */
const onShift = (p,ds) => !!dayRec(ds) && !absentOn(p.id,ds) &&
  ((dayRec(ds).crew||[]).includes(p.id) || (dayRec(ds).ops||[]).includes(p.id));
const crewOn = ds => (dayRec(ds)?.crew||[]).map(staffById).filter(p=>p&&!absentOn(p.id,ds));
const opsOn  = ds => (dayRec(ds)?.ops||[]).map(staffById).filter(p=>p&&!absentOn(p.id,ds));
const planFor = ds => dayRec(ds)?.planned ?? 0;
const bookedOn = ds => S.requests.filter(r=>r.date===ds&&r.status!=='отменена').length;
const bookedIn = (ds,c) => S.requests.filter(r=>r.date===ds&&r.city===c&&r.status!=='отменена').length;
function dayTotal(ds){
  const p = planFor(ds), b = bookedOn(ds), pct = p?b/p:0;
  return {p,b,pct,s:p===0?'off':pct>1.1?'over':pct>=1?'full':pct>=.5?'fill':'free'};
}
const dayState = dayTotal;
/* Услуга теперь живёт в строке прибора: две поверки на адресе — две услуги в расчёте. */
const worksOf = r => (r.devices||[]).map(d=>d.svc).filter(id=>SVC[id]);
const rateV = r => worksOf(r).reduce((a,id)=>a+SVC[id].rV,0);
const rateO = r => worksOf(r).reduce((a,id)=>a+SVC[id].rO,0);
const priceOf = r => worksOf(r).reduce((a,id)=>a+(r.clientType==='Юрлицо'?SVC[id].pU:SVC[id].pF),0);
function svcNames(r){
  const w = worksOf(r); if(!w.length) return '<span class="note">по факту</span>';
  const c = {}; w.forEach(id=>c[id]=(c[id]||0)+1);
  return Object.entries(c).map(([id,n])=>esc(SVC[id].name)+(n>1?` <b class="mono">×${n}</b>`:'')).join(', ');
}
const photoCount = r => (r.devices||[]).reduce((a,d)=>a+(d.photos?.length||0),0);
const addrOf = r => `${r.street}, ${r.house}${r.entrance?', под. '+r.entrance:''}${r.flat?', кв. '+r.flat:''}`;
function toast(m){ S.toast=m; render(); clearTimeout(S._t); S._t=setTimeout(()=>{S.toast=null;render();},3000); }

function badgeFor(v,role){
  if(v==='support') return S.routes.filter(r=>r.date===TODAY&&r.status!=='выполнен').length;
  if(v==='routes') return S.routes.filter(r=>r.date>=TODAY&&!r.verifier).length;
  if(v==='absence') return role==='supervisor'?S.absences.filter(a=>a.status==='на согласовании').length:0;
  if(v==='myroute') return S.routes.filter(r=>r.verifier===ROLES.verifier.id&&r.date===TODAY&&r.status!=='выполнен').length;
  return 0;
}
function shell(side,main){
  const ini = S.user.replace(/[^А-ЯA-Z]/g,'').slice(0,2);
  const crew = crewOn(S.day).length, ops = opsOn(S.day).length, need = Math.max(1,Math.ceil(crew/10));
  const now = new Date();
  let i = -1;
  return `<div class="stage"><div class="app">
    <nav class="rail">
      <div class="logo" title="CRM «Учёткин»">${iconAt(22)}</div>
      <div class="nav">${GROUPS.map(g=>`<div class="grp" data-g="${g.short}">${g.views.map(v=>{
        i++; const b=badgeFor(v,g.role), n=i;
        return `<button class="nb" title="${TITLES[v]} · ${ROLES[g.role].label}" aria-current="${S.page===n}" onclick="goPage(${n})">
          ${svg(I[v])}${b?`<span class="bdg">${b}</span>`:''}</button>`}).join('')}</div>`).join('')}</div>
      <div class="foot">
        <button class="nb" title="Переключить тему" onclick="toggleTheme()">${svg(S.theme==='light'?I.moon:I.sun,18)}</button>
        <button class="nb" title="Выйти" onclick="S.auth=false;endCall(1);render()">${svg(I.out,18)}</button>
        <div class="ava" title="${esc(S.user)} · ${ROLES[S.role].label}">${ini}<i></i></div>
      </div>
    </nav>
    <div class="col">
      <header class="hd">
        <div class="ttl"><span class="lbl">Учёткин /</span><span class="tg t-mut">${ROLES[S.role].label}</span><b>${TITLES[S.view]}</b></div>
        <div class="step">
          <button class="ib xs" title="Предыдущая страница · Alt+←" onclick="step(-1)">${svg(I.left,13)}</button>
          <span class="mono">${pad(S.page+1)} / ${PAGES.length}</span>
          <button class="ib xs" title="Следующая страница · Alt+→" onclick="step(1)">${svg(I.right,13)}</button>
        </div>
        <div style="flex:1"></div>
        <span class="chip"><span class="dot"></span>${crew} ПОВЕРИТЕЛЕЙ</span>
        <span class="chip" ${ops<need?'style="color:var(--warning);border-color:var(--warning)"':''}>ОПЕРАТОРЫ ${ops}/${need}</span>
        <span class="mono" style="font-size:11px;letter-spacing:.08em;color:var(--ink3)">${ru(TODAY)} · <span style="color:var(--ink2)">${pad(now.getHours())}:${pad(now.getMinutes())}</span></span>
        <button class="ib" title="Уведомления">${svg(I.bell,16)}</button>
      </header>
      <div class="body">${side?`<aside class="side">${side}</aside>`:''}<div class="main">${main}</div></div>
    </div>
  </div></div>${modalLayer()}${callWindow()}${lightbox()}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}`;
}
const cap = () => `<p class="cap">${CAPS[S.view]||''}</p>`;

/* ---------- лента ёмкости: четыре полные недели, первая — текущая ---------- */
function ribbon(){
  const mon = addDays(today,-((today.getDay()+6)%7));   // понедельник текущей недели
  const weeks = Array.from({length:4},(_,w)=>Array.from({length:7},(_,i)=>iso(addDays(mon,w*7+i))));
  return `<div class="rib4">
    <div class="wk wkd">${['пн','вт','ср','чт','пт','сб','вс'].map(d=>`<span>${d}</span>`).join('')}</div>
    ${weeks.map((days,w)=>{
    let wp=0, wb=0;
    days.forEach(ds=>{const x=dayTotal(ds); wp+=x.p; wb+=x.b;});
    return `<div>
      <div class="wkh"><span class="lbl ${w===0?'now':''}">${w===0?'Текущая неделя':'Неделя +'+w}</span>
        <span class="rg">${ru(days[0]).slice(0,5)} — ${ru(days[6]).slice(0,5)}</span>
        <span class="tot">${wb} / ${wp}${wp?` · ${Math.round(wb/wp*100)}%`:''}</span></div>
      <div class="wk">${days.map(ds=>{
        const {p,b,pct,s} = dayTotal(ds), d = new Date(ds+'T00:00:00'), past = ds<TODAY;
        const cs = dayCities(ds);
        const tip = cs.length?cs.map(c=>{const x=dayState(ds,c);return `${c} ${x.b}/${x.p}`}).join(' · '):'выходной';
        return `<button class="day ${past?'past':''} ${ds===TODAY?'tdy':''}" data-s="${s}" aria-pressed="${S.day===ds}"
          title="${ru(ds)} · ${b} из ${p} · ${tip}" ${s==='off'||past?'disabled':`onclick="pickDay('${ds}')"`}>
          <div class="bar"><div class="fill" style="height:${Math.min(100,pct*90.9)}%"></div>
          <span class="pct">${p?Math.round(pct*100)+'%':'—'}</span></div>
          <div class="dd">${pad(d.getDate())}.${pad(d.getMonth()+1)}</div>
          <div class="cts">${cs.length?(cs.length===1?esc(cs[0]):cs.map(c=>CSHORT[c]||c).join(' · ')):'—'}</div></button>`;
      }).join('')}</div></div>`;
  }).join('')}</div>
  <div class="lg">
    <span><i style="background:var(--ink3);opacity:.3"></i>свободно</span>
    <span><i style="background:var(--cold);opacity:.45"></i>заполняется</span>
    <span><i style="background:var(--ink);opacity:.72"></i>план набран</span>
    <span><i style="background:var(--error);opacity:.6"></i>сверх 110% — приём закрыт</span>
    <span><i style="border-top:1px dashed var(--mark);height:0;width:14px"></i>граница +10%</span></div>`;
}
/* Выбор дня подтягивает город заявки к тем, где в этот день работает бригада. */
function pickDay(ds){
  S.day = ds;
  const cs = dayCities(ds);
  if(cs.length && !cs.includes(S.intake.city)) S.intake.city = cs[0];
  render();
}

      <div class="f" style="margin-bottom:0"><label>Телефон дополнительный</label>${PHONE(p+'Phone2',K.phone2,'phone2','дополнительный',T)}</div>
      <div class="f" style="margin-bottom:0"><label>ФИО контакта</label>

      <div class="f" style="width:50px"><label>под.</label><input class="fld mono" id="${p}Ent" value="${esc(K.entrance)}" oninput="${T}.entrance=this.value" placeholder="3"></div>
      <div class="f" style="width:50px"><label>эт.</label><input class="fld mono" id="${p}Floor" value="${esc(K.floor)}" oninput="${T}.floor=this.value" placeholder="5"></div>
      <div class="f" style="width:50px"><label>кв.</label><input class="fld mono" id="${p}Flat" value="${esc(K.flat)}" oninput="${T}.flat=this.value" placeholder="45"></div>
      <div class="f" style="width:76px"><label>Домофон</label>
        <div class="chkbox">${CHK(K.intercom,K.intercom?'вкл.':'выкл.',`${T}.intercom=!${T}.intercom;render()`)}</div></div>
      <div class="f" style="width:120px"><label>Дата выезда</label>${DATE(p+'Date',day,onDay)}</div>
      <div class="f" style="width:150px"><label>Время прибытия</label>
        ${SEL(p+'Time',K.time,Array.from({length:11},(_,i)=>({v:10+i,l:pad(10+i)+':00',hint:'окно '+pad(9+i)+':00–'+pad(11+i)+':00'})),v=>K.time=+v)}</div>
    </div>
    <div class="g2">

      <div class="f" style="margin-bottom:0"><label>Комментарий для поверителей</label>
        <textarea class="fld" id="${p}CmtVf" oninput="${T}.cmtVf=this.value" placeholder="Что важно знать на адресе: доступ к стояку, собака, состояние пломбы">${esc(K.cmtVf)}</textarea></div>

function setF(path,k,v){ (path==='S.edit'?S.edit:S.intake)[k]=v; render(); }

/* ---------- приём заявки ---------- */
function viewIntake(){
  const K = S.intake;
  const t = dayTotal(S.day), closed = t.pct>1.1 || t.p===0;
  const mine = S.requests.filter(r=>r.operator===S.me && r.created===TODAY)
    .sort((a,b)=>b.id.localeCompare(a.id));
  return shell(null, `
  <div class="c"><h3>Ёмкость</h3>
    ${ribbon()}</div>

  <div class="c"><h3>Линия оператора</h3>
    ${opConsole()}</div>

  <div class="c"><h3>Новая заявка</h3>
    ${reqForm(K,'S.intake','in',S.day,v=>{pickDay(v);})}
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="b long" onclick="createReq()" ${closed?'disabled':''}>${closed?'День закрыт — приём остановлен':'Сохранить заявку'}</button></div>
  </div>

  <div class="c"><h3>Мои заявки за сегодня · ${mine.length}</h3>
    ${mine.length?`<table><thead><tr><th>Заявка</th><th class="num">Создана</th><th class="num">Выполнение</th><th>Город</th><th>Тип</th><th>Статус</th></tr></thead><tbody>
      ${mine.slice(0,25).map(r=>`<tr><td class="mono"><b>${r.id}</b></td><td class="num mono">${ru(r.created)}</td>
        <td class="num mono">${r.status==='отменена'?'<span class="note">—</span>':ru(r.date)}</td>
        <td>${r.city}</td>
        <td><span class="tg ${r.clientType==='Юрлицо'?'t-ink':'t-mut'}">${r.clientType==='Юрлицо'?'юрлицо':'физлицо'}</span></td>
        <td>${reqTag(r.status)}</td></tr>`).join('')}</tbody></table>
      ${mine.length>25?`<p class="note" style="margin-top:10px">Показаны последние 25 из ${mine.length}.</p>`:''}`
      :`<div class="empty">Сегодня вы ещё не приняли ни одной заявки.</div>`}</div>`);
}
const reqTag = s => `<span class="tg ${s==='выполнена'?'t-ok':s==='отменена'?'t-err':s==='перенос'?'t-warn':s==='в маршруте'?'t-cold':'t-mut'}">${s}</span>`;
function setIn(k,v){ S.intake[k]=v; render(); }

/* ============ ПУЛЬТ ОПЕРАТОРА (заготовка под облачную АТС) ============ */
const hms = s => pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
const ms  = s => pad(Math.floor(s/60))+':'+pad(s%60);
const shiftSec = () => S.op.shiftSec + (S.op.on&&S.op.from ? Math.floor((Date.now()-S.op.from)/1000) : 0);
const talkSec  = () => S.op.talkSec + (S.op.live ? Math.floor((Date.now()-S.op.live.t0)/1000) : 0);
/* Пока идёт разговор или постобработка, оператор системно на паузе — новые вызовы не приходят. */
const opBusy = () => !!(S.op.live || S.op.acw>0);

function opConsole(){
  const O = S.op;
  const state = O.live?'live' : O.inc?'ring' : '';
  return `<div class="opbar ${state}">
    <button class="opsw" role="switch" aria-pressed="${O.on}" onclick="toggleShift()">
      <span class="tr"><i></i></span>
      <span><b>${O.on?'На смене':'Не на смене'}</b>
        <small>${O.on?(opBusy()?'пауза':'принимает вызовы'):'вызовы уходят другим'}</small></span>
    </button>
    ${opLine()}</div>`;
}
function opLine(){
  const O = S.op;
  if(O.live){
    const sec = Math.floor((Date.now()-O.live.t0)/1000);
    return `<div class="opline">
      <span class="ic">${svg(I.phone,18)}</span>
      <div class="info"><div class="st">вызов принят</div>
        <div class="no">${esc(O.live.num)}</div></div>
      <div class="tm mono" id="opLive">${ms(sec)}</div>
      <div class="acts">
        <button class="g" onclick="toast('Перевод на старшего оператора — в интеграции с облачной АТС.')">Перевести</button>
        <button class="g end" onclick="hangup()">${svg(I.hang,13)}Завершить</button></div></div>`;
  }
  if(O.acw>0){
    return `<div class="opline">
      <span class="ic">${svg(I.act,18)}</span>
      <div class="info"><div class="st">постобработка</div>
        <div class="no idle">Заполните заявку — сохранение снимет паузу</div></div>
      <div class="tm mono" id="opAcw">${ms(O.acw)}</div>
      <div class="acts"><button class="g" onclick="S.op.acw=0;S.op.next=rint(5,12);render()">Готов</button></div></div>`;
  }
  if(O.inc){
    const sec = Math.floor((Date.now()-O.inc.t0)/1000);
    return `<div class="opline">
      <span class="ic">${svg(I.phone,18)}</span>
      <div class="info"><div class="st">входящий вызов</div>
        <div class="no">${esc(O.inc.num)}</div></div>
      <div class="tm mono" id="opRing">${ms(sec)}</div>
      <div class="acts">
        <button class="b ans" onclick="answer()">${svg(I.phone,13)}Принять</button>
        <button class="g end" onclick="reject()">Отклонить</button></div></div>`;
  }
  return `<div class="opline">
    <span class="ic">${svg(I.phone,18)}</span>
    <div class="info"><div class="st">${S.op.on?'линия свободна':'линия отключена'}</div>
      <div class="no idle">${S.op.on?'Ждём входящий с облачной АТС':'Включите смену, чтобы принимать вызовы'}</div></div></div>`;
}
function toggleShift(){
  const O = S.op;
  if(O.on && O.live) return toast('Идёт разговор. Завершите вызов, потом снимайтесь со смены.');
  if(O.on){ O.shiftSec = shiftSec(); O.on=false; O.from=null; O.inc=null; O.acw=0;
    toast('Смена закрыта. Вызовы уходят другим операторам.'); }
  else { O.on=true; O.from=Date.now(); O.next=rint(3,8); toast('Вы на смене. Входящие пойдут на вашу линию.'); }
  render();
}
function ringIn(){
  const prev = S.requests.filter(r=>r.phone).slice(-60);
  const known = rr()<.3 && prev.length ? rnd(prev) : null;
  S.op.inc = {num:known?known.phone:randPhone(),t0:Date.now()};
  render();
}
function answer(){
  const c = S.op.inc; if(!c) return;
  S.op.inc = null;
  S.op.live = {num:c.num,t0:Date.now()};
  S.op.calls++;
  /* Из звонка берём только номер — и тот оператор может заменить:
     звонят с городского, а для связи оставляют сотовый. */
  S.intake.phone = fmtPhone(c.num);
  render();
}
function reject(){ S.op.inc=null; S.op.missed++; S.op.next=rint(4,10);
  toast('Вызов отклонён — уходит следующему свободному оператору.'); }
function hangup(){
  const L = S.op.live; if(!L) return;
  S.op.talkSec += Math.floor((Date.now()-L.t0)/1000);
  S.op.live = null; S.op.acw = 12;
  toast('Разговор завершён. Заполните заявку — сохранение снимет паузу.');
}
/* Тик раз в секунду. Числа обновляются точечно, полный render — только на смене состояния.
   Счётчики смены и разговоров копятся в состоянии, оператору их не показываем. */
function opTick(){
  const O = S.op;
  if(!S.auth) return;
  const here = S.view==='intake';
  const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  if(O.live){ if(here) set('opLive',ms(Math.floor((Date.now()-O.live.t0)/1000))); return; }
  if(O.acw>0){ O.acw--;
    if(O.acw<=0){ O.next=rint(5,12); if(here) render(); } else if(here) set('opAcw',ms(O.acw));
    return; }
  if(O.inc){
    const sec = Math.floor((Date.now()-O.inc.t0)/1000);
    if(sec>=25){ O.inc=null; O.missed++; O.next=rint(6,14);
      if(here) toast('Вызов не принят за 25 секунд — ушёл в очередь.'); return; }
    if(here) set('opRing',ms(sec));
    return;
  }
  if(!here) return;   // вызов приходит только когда оператор смотрит на линию
  if(O.on && O.next>0 && --O.next<=0) ringIn();
}
function createReq(){
  const K = S.intake;
  if(!K.name.trim()) return toast(K.ctype==='Юрлицо'?'Укажите название организации.':'Укажите ФИО клиента.');
  if(K.ctype==='Юрлицо'){
    const inn = String(K.inn).replace(/\D/g,'');
    if(!inn) return toast('Для юрлица ИНН обязателен — без него не выставить счёт и закрывающие.');
    if(inn.length!==10 && inn.length!==12) return toast('ИНН — 10 цифр у организации или 12 у ИП. Сейчас '+inn.length+'.');
  }
  if(!K.phone.trim()) return toast('Укажите телефон — по нему пойдёт прозвонка маршрута.');
  if(digitsOf(K.phone).length!==10) return toast('Телефон неполный: нужно 10 цифр после +7.');
  if(K.phone2 && digitsOf(K.phone2).length!==10) return toast('Дополнительный телефон неполный: нужно 10 цифр после +7.');
  const city = K.city || dayCities(S.day)[0];
  if(!city) return toast('В этот день бригада не выезжает — выберите другую дату.');
  if(!K.house.trim()) return toast('Укажите номер дома.');
  S.requests.push({id:'R'+(++S.seq),date:S.day,created:TODAY,city,clientType:K.ctype,name:K.name,
    inn:K.ctype==='Юрлицо'?K.inn:'',phone:K.phone,contact:K.contact,phone2:K.phone2,contact2:K.contact2,
    street:K.street,house:K.house,entrance:K.entrance,floor:K.floor,
    flat:K.flat,intercom:K.intercom,time:K.time,cmtOp:K.cmtOp,cmtVf:K.cmtVf,
    services:[],devices:[],status:'создана',routeId:null,operator:S.me});
  const wasAcw = S.op.acw>0;
  if(wasAcw){ S.op.acw=0; S.op.next=rint(5,12); }
  S.intake = blankIntake(); S.intake.city = city;
  toast('Заявка сохранена: '+city+', '+ru(S.day)+', окно '+pad(K.time-1)+':00–'+pad(K.time+1)+':00.'
    + (wasAcw?' Постобработка закрыта, линия снова принимает вызовы.':''));
}

/* ---------- телефон и мини-окно вызова ---------- */
/* Маска: оператор набирает только цифры, поле само собирает +7 (963) 441-45-30. */
const digitsOf = v => String(v||'').replace(/\D/g,'').replace(/^[78]/,'').slice(0,10);
function fmtPhone(v){
  const d = digitsOf(v);
  if(!d) return '';
  let s = '+7 ('+d.slice(0,3);
  if(d.length>3) s += ') '+d.slice(3,6);
  if(d.length>6) s += '-'+d.slice(6,8);
  if(d.length>8) s += '-'+d.slice(8,10);
  return s;
}
function phoneIn(el,k,T){
  const O = (T==='S.edit')?S.edit:S.intake;
  const prev = O[k]||'';
  let d = digitsOf(el.value);
  /* Backspace съел разделитель, а не цифру — убираем цифру сами, иначе каретка встанет колом. */
  if(el.value.length < prev.length && d === digitsOf(prev)) d = d.slice(0,-1);
  const out = fmtPhone(d);
  O[k] = out; el.value = out;
  const end = out.length;
  if(typeof el.setSelectionRange==='function'){ try{ el.setSelectionRange(end,end); }catch(e){} }
  const btn = el.parentElement.querySelector('.call');
  if(btn) btn.disabled = d.length<10;
}
function PHONE(id,val,key,kind,T){
  const full = digitsOf(val).length===10;
  return `<div class="phone">
    <input class="mono" id="${id}" value="${esc(val||'')}" inputmode="tel" maxlength="18"
      oninput="phoneIn(this,'${key}','${T||'S.intake'}')" placeholder="+7 (___) ___-__-__">
    <button type="button" class="call" ${full?'':'disabled'} title="Позвонить клиенту"
      onclick="startCall(document.getElementById('${id}').value,'${kind}')">${svg(I.phone,12)}Вызов</button></div>`;
}
function startCall(num,kind,who){
  num = String(num||'').trim(); if(num.length<5) return toast('Телефон не заполнен — набирать нечего.');
  S.call = {num,kind:kind||'основной',who:who||(S.intake.name.trim()||'Клиент'),st:'набор',t0:Date.now()};
  clearInterval(S._call); S._call = setInterval(tickCall,500); render();
}
function tickCall(){
  if(!S.call) return clearInterval(S._call);
  const sec = Math.floor((Date.now()-S.call.t0)/1000);
  if(S.call.st==='набор' && sec>=2){ S.call.st='разговор'; S.call.t0=Date.now();
    const st=document.getElementById('callSt'), dt=document.getElementById('callDot');
    if(st) st.textContent='разговор'; if(dt) dt.style.background='var(--success)'; return; }
  const el = document.getElementById('callSec');
  if(el) el.textContent = pad(Math.floor(sec/60))+':'+pad(sec%60);
}
function endCall(silent){
  clearInterval(S._call);
  const c = S.call; S.call = null;
  if(silent) return;
  if(!c) return render();
  const sec = Math.floor((Date.now()-c.t0)/1000);
  toast(c.st==='разговор'
    ? `Звонок завершён · ${pad(Math.floor(sec/60))}:${pad(sec%60)}. В боевой версии длительность и запись прилетают из облачной АТС в карточку заявки.`
    : 'Вызов сброшен до соединения.');
}
function callWindow(){
  const c = S.call; if(!c) return '';
  return `<div class="callw">
    <div class="top"><span class="dot" id="callDot" ${c.st==='разговор'?'style="background:var(--success)"':''}></span>
      <span class="st" id="callSt">${c.st}</span><span class="sec mono" id="callSec">00:00</span></div>
    <b>${esc(c.who)}</b>
    <div class="num mono">${esc(c.num)}</div>
    <div class="who">${c.kind} номер · линия ${esc(staffById(S.me)?.ext||'—')} · ${esc(S.user)}</div>
    <div class="acts">
      <button class="g" onclick="toast('Перевод на другого оператора — в интеграции с облачной АТС.')">Перевести</button>
      <button class="g end" onclick="endCall()">${svg(I.hang,13)}Завершить</button></div>
  </div>`;
}

/* Миниатюра заявки на шкале: город, улица и две кнопки — открыть и позвонить. */
function chip({rt,s,i,r}){
  return `<div class="chip2 ${s.done?'fin':''}">
    <span class="mono rt">${rt.id}</span>
    <div class="ad"><b>${esc(r.city)}</b><small>${esc(r.street)}, ${r.house}${r.flat?', кв. '+r.flat:''}</small></div>
    ${s.called?`<span class="tg ${s.called==='подтверждена'?'t-ok':s.called==='перенос'?'t-warn':'t-err'}">${s.called}</span>`:''}
    <div class="ctl">
      <button class="ib sm" title="На час раньше" onclick="shiftReq('${r.id}',-1)" ${r.time<=10?'disabled':''}>${svg(I.up,12)}</button>
      <button class="ib sm" title="На час позже" onclick="shiftReq('${r.id}',1)" ${r.time>=20?'disabled':''}>${svg(I.down,12)}</button>
      <button class="g sm" onclick="openReq('${r.id}')">Открыть</button>
      <button class="ib sm ok" title="Позвонить ${esc(r.phone)}" onclick="startCall('${esc(r.phone)}','основной','${esc(r.name)}')">${svg(I.phone,13)}</button>

}
function shiftReq(id,d){
  const r = S.requests.find(x=>x.id===id);
  const t = r.time + d;
  if(t<10 || t>20) return;
  r.time = t; render();
  toast(`${r.id}: окно сдвинуто на ${pad(t-1)}:00–${pad(t+1)}:00. Поверитель увидит изменение в маршруте.`);
}
function addToRoute(rid,reqId){
  const rt = S.routes.find(r=>r.id===rid), r = S.requests.find(x=>x.id===reqId);
  if(!rt||!r) return;
  r.routeId = rt.id; r.status = 'в маршруте';
  rt.stops.push({req:r.id,called:null,done:false});
  rt.stops.sort((a,b)=>{const A=S.requests.find(x=>x.id===a.req),B=S.requests.find(x=>x.id===b.req);
    return (A?.time||0)-(B?.time||0);});
  toast(`${r.id} добавлена в ${rt.id} на ${pad(r.time-1)}:00–${pad(r.time+1)}:00.`);
}
/* Карточка заявки правится поверх страницы: копия, чтобы «Отмена» ничего не портила. */
function openReq(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  S.edit = {...r, day:r.date};
  S.modal = {k:'req',id};
  render();
}
function saveReq(){
  const K = S.edit, r = S.requests.find(x=>x.id===S.modal.id);
  if(!r) return;
  if(!K.name.trim()) return toast('Имя клиента или организация не заполнены.');
  if(K.ctype==='Юрлицо' && ![10,12].includes(String(K.inn).replace(/\D/g,'').length))
    return toast('ИНН — 10 цифр у организации или 12 у ИП.');
  if(digitsOf(K.phone).length!==10) return toast('Телефон неполный: нужно 10 цифр после +7.');
  if(!K.house.trim()) return toast('Укажите номер дома.');
  ['ctype','name','inn','phone','contact','phone2','contact2','city','street','house',
   'entrance','floor','flat','intercom','time','cmtOp','cmtVf'].forEach(k=>r[k]=K[k]);
  const moved = r.date!==K.day;
  if(moved){ r.date = K.day; r.routeId = null; r.status = 'создана';
    S.routes.forEach(rt=>{ const j=rt.stops.findIndex(s=>s.req===r.id); if(j>=0) rt.stops.splice(j,1); }); }
  S.modal = null; S.edit = null;
  toast(moved ? `${r.id} перенесена на ${ru(r.date)} и снята с маршрута — поставьте её в маршрут той даты.`
              : `${r.id} обновлена.`);
}
function closeModal(){ S.modal=null; S.edit=null; render(); }
function modalLayer(){
  if(!S.modal) return '';

  if(S.modal.k==='rc') return rcModal();

    return `<div class="mask" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="width:min(620px,94vw)">

          <button class="ib" onclick="closeModal()">${svg(I.no,15)}</button></div>

        <button class="ib" onclick="closeModal()">${svg(I.no,15)}</button></div>
      ${reqForm(K,'S.edit','ed',K.day,v=>{K.day=v;})}
      <div class="row" style="margin-top:14px;justify-content:flex-end">

    </div></div>`;
}
function chatPanel(rt){
  return `<p class="cap">Переписка дублируется руководителю без уведомлений.</p>
    <div class="chat">${rt.chat.length?rt.chat.map(m=>`<div class="msg ${m.vf?'v':''}"><b>${esc(m.who)}</b><small>${m.t}</small><br>${esc(m.txt)}</div>`).join('')

/* ============ СБОРКА МАРШРУТОВ (руководитель) ============ */
/* Карта: окно 7° долготы × 3.8° широты ≈ 423 × 422 км, поэтому кадр квадратный. */
const GEO = {
  'Екатеринбург':[60.61,56.84],'Нижний Тагил':[59.97,57.92],'Каменск-Уральский':[61.93,56.41],
  'Первоуральск':[59.94,56.91],'Верхняя Пышма':[60.58,56.97],'Берёзовский':[60.81,56.91],
  'Ревда':[59.91,56.80],'Полевской':[60.19,56.49],'Асбест':[61.46,57.01],'Заречный':[61.33,56.81],
  'Сухой Лог':[62.03,56.91],'Богданович':[62.05,56.78],'Арамиль':[60.83,56.70],'Среднеуральск':[60.47,56.99],
  'Дегтярск':[60.09,56.70],'Верхняя Салда':[60.55,58.05],'Невьянск':[60.22,57.49],'Кировград':[60.06,57.43],
  'Реж':[61.39,57.37],'Артёмовский':[61.89,57.34],'Алапаевск':[61.70,57.85],'Серов':[60.58,59.60],
  'Краснотурьинск':[60.19,59.77],'Качканар':[59.49,58.70],'Кушва':[59.76,58.28],'Нижняя Тура':[59.81,58.63],
  'Красноуфимск':[57.77,56.61],'Ирбит':[63.07,57.68],'Талица':[63.72,57.01],'Новоуральск':[60.09,57.25]
};
const MV = {lon0:57.2,lon1:64.2,lat0:56.2,lat1:60.0,size:600};
const mLon = lon => (lon-MV.lon0)/(MV.lon1-MV.lon0)*MV.size;
const mLat = lat => (MV.lat1-lat)/(MV.lat1-MV.lat0)*MV.size;
const OBLAST = [[58.9,61.6],[61.5,61.4],[63.0,60.6],[64.0,59.9],[64.6,59.0],[65.6,58.4],[66.2,57.6],
  [65.2,57.0],[64.3,56.9],[63.6,56.3],[62.6,56.0],[61.7,56.1],[60.7,56.1],[59.9,56.3],[59.0,56.4],
  [58.2,56.4],[57.5,56.7],[57.3,57.3],[57.6,58.0],[58.2,58.7],[58.6,59.4],[58.5,60.3]];
const oblastPath = 'M '+OBLAST.map(([lon,lat])=>`${mLon(lon).toFixed(1)} ${mLat(lat).toFixed(1)}`).join(' L ')+' Z';
const clampM = v => Math.max(16,Math.min(MV.size-16,v));

/* Адреса внутри города раскладываются подсолнухом: детерминированно и без свалки в точке. */
function rcPoints(ds){
  const all = S.requests.filter(r=>r.date===ds && r.status!=='отменена')
    .sort((a,b)=>a.id.localeCompare(b.id));
  const byCity = {};
  all.forEach(r=>{ (byCity[r.city] ||= []).push(r); });
  const pts = [], clusters = [];
  Object.entries(byCity).forEach(([city,list])=>{
    const g = GEO[city]; if(!g) return;
    const cx = mLon(g[0]), cy = mLat(g[1]);
    const R = 20 + Math.sqrt(list.length)*4.4;
    clusters.push({city,cx,cy,R,n:list.length});
    list.forEach((r,k)=>{
      const rad = R*Math.sqrt((k+.5)/list.length), a = k*2.399963;
      pts.push({r,city,x:clampM(cx+rad*Math.cos(a)),y:clampM(cy+rad*Math.sin(a)),taken:!!r.routeId});
    });
  });
  return {pts,clusters};
}
function openRC(ds){
  S.rc = {date:ds||iso(addDays(today,1)), sel:[], made:[]};
  S.modal = {k:'rc'}; render();
}
function rcDate(v){ S.rc.date = v; S.rc.sel = []; render(); }
function rcPick(id){
  const r = S.requests.find(x=>x.id===id);
  if(!r || r.routeId) return;
  const i = S.rc.sel.indexOf(id);
  if(i>=0) S.rc.sel.splice(i,1); else S.rc.sel.push(id);
  render();
}
function rcCreate(){
  const sel = S.rc.sel;
  if(sel.length<2) return toast('Выберите на карте хотя бы две точки — маршрут строится по последовательности.');
  const reqs = sel.map(id=>S.requests.find(x=>x.id===id)).filter(Boolean);
  const cities = [...new Set(reqs.map(r=>r.city))];
  const rt = {id:'M'+(++S.seq),date:S.rc.date,city:cities[0],cities,verifier:null,status:'черновик',
    stops:reqs.map(r=>({req:r.id,called:null,done:false})),chat:[],duty:null};
  reqs.forEach(r=>{ r.routeId = rt.id; r.status = 'в маршруте'; });
  S.routes.push(rt); S.rc.made.unshift(rt.id); S.rc.sel = [];
  toast(`${rt.id}: ${reqs.length} адресов, ${cities.join(' · ')}. Назначьте поверителя справа.`);
}
function rcAssign(id,v){
  const rt = S.routes.find(r=>r.id===id); if(!rt) return;
  rt.verifier = v||null;
  if(rt.verifier && rt.status==='черновик') rt.status='обзвонен';
}
function rcDrop(rid,reqId){
  const rt = S.routes.find(r=>r.id===rid); if(!rt) return;
  const j = rt.stops.findIndex(s=>s.req===reqId); if(j<0) return;
  rt.stops.splice(j,1);
  const r = S.requests.find(x=>x.id===reqId);
  if(r){ r.routeId=null; r.status='создана'; }
  if(!rt.stops.length) return rcDisband(rid);
  toast(`${reqId} исключена из ${rid} и вернулась в свободные.`); render();
}
function rcDisband(id){
  const rt = S.routes.find(r=>r.id===id); if(!rt) return;
  rt.stops.forEach(s=>{ const r=S.requests.find(x=>x.id===s.req);
    if(r){ r.routeId=null; r.status='создана'; } });
  S.routes = S.routes.filter(r=>r.id!==id);
  if(S.rc) S.rc.made = S.rc.made.filter(x=>x!==id);
  toast(`${id} расформирован, адреса вернулись в свободные.`); render();
}
function closeRC(){ S.rc=null; S.modal=null; render(); }
function rcModal(){
  const C = S.rc; if(!C) return '';
  const ds = C.date;
  const {pts,clusters} = rcPoints(ds);
  const crew = crewOn(ds);
  const free = pts.filter(p=>!p.taken).length;
  const selPts = C.sel.map(id=>pts.find(p=>p.r.id===id)).filter(Boolean);
  const line = selPts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const made = C.made.map(id=>S.routes.find(r=>r.id===id)).filter(Boolean);
  const cs = dayCities(ds);
  return `<div class="mask" onclick="if(event.target===this)closeRC()">
    <div class="modal rcm">
      <div class="mhd"><h3>Конструктор маршрутов</h3>
        <span class="note">Выбирайте точки по порядку — между ними протянется связь. Закрытие окна не отменяет созданные маршруты.</span>
        <button class="ib" onclick="closeRC()">${svg(I.no,15)}</button></div>

      <div class="rchd">
        <div class="f" style="width:150px;margin:0"><label>Дата выезда</label>${DATE('rcDate',ds,v=>rcDate(v))}</div>
        <div class="rcst">
          <div><b class="mono">${crew.length}</b> поверителей в смене</div>
          <div class="who">${crew.length?crew.map(p=>esc(p.name)).join(' · '):'<span style="color:var(--warning)">смена не назначена — задайте её в планировании</span>'}</div>
        </div>
        <div class="rcst">
          <div><b class="mono">${free}</b> свободных из ${pts.length} заявок${cs.length?` · ${cs.map(c=>esc(c)).join(' · ')}`:''}</div>
          <div class="who">${C.sel.length?`выбрано ${C.sel.length} — идут в маршрут в порядке нажатия`:'точка = адрес заявки, повторный клик снимает выбор'}</div>
        </div>
        <button class="b" onclick="rcCreate()" ${C.sel.length>1?'':'disabled'}>Создать маршрут${C.sel.length>1?` · ${C.sel.length}`:''}</button>
      </div>

      <div class="rcbody">
        <div class="rcmap">
          <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта Свердловской области">
            <defs><pattern id="mg" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0v40" fill="none" stroke="var(--gridA)" stroke-width="1"/></pattern></defs>
            <rect width="600" height="600" fill="url(#mg)"/>
            <path d="${oblastPath}" fill="var(--wash)" stroke="var(--mark)" stroke-width="1.5" stroke-linejoin="round"/>
            ${(()=>{ /* подписи городов не должны наезжать друг на друга */
              const placed = [];
              return clusters.slice().sort((a,b)=>a.cy-b.cy).map(c=>{
                let ly = c.cy - c.R - 7;
                const w = 7*(c.city.length+4);
                while(placed.some(q=>Math.abs(q.x-c.cx)<(q.w+w)/2 && Math.abs(q.y-ly)<13)) ly -= 13;
                placed.push({x:c.cx,y:ly,w});
                return `<g class="mcity"><circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="2.5"/>
                  <text x="${c.cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(c.city)} · ${c.n}</text></g>`;
              }).join('');

            ${line?`<polyline points="${line}" class="mline halo"/><polyline points="${line}" class="mline"/>`:''}
            ${pts.map(p=>{const k=C.sel.indexOf(p.r.id);
              return `<g class="mp ${p.taken?'taken':''} ${k>=0?'on':''}" ${p.taken?'':`onclick="rcPick('${p.r.id}')"`}>
                <title>${esc(p.r.city)}, ${esc(addrOf(p.r))} · ${pad(p.r.time-1)}:00–${pad(p.r.time+1)}:00${p.taken?' · уже в маршруте '+p.r.routeId:''}</title>
                <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" class="hit"/>
                <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${k>=0?5.5:4}" class="dot"/>

            <g class="mlg" transform="translate(12,12)">
              <rect x="0" y="0" width="330" height="26" rx="6"/>

              <circle cx="106" cy="13" r="5" class="d2"/><text x="116" y="17">в маршруте этой сессии</text>
              <circle cx="262" cy="13" r="4" class="d3"/><text x="272" y="17">занята</text></g>
          </svg>
        </div>
        <div class="rclist">
          <div class="lbl" style="margin-bottom:8px">Маршруты этой сессии · ${made.length}</div>
          ${made.length?made.map(rt=>`<div class="rcr">
            <div class="rch"><b class="mono">${rt.id}</b>
              <span class="note">${rt.stops.length} адр. · ${(rt.cities||[rt.city]).join(' · ')}</span>
              <button class="ib sm no" title="Расформировать" onclick="rcDisband('${rt.id}')">${svg(I.no,12)}</button></div>
            <div class="f" style="margin:8px 0 0">
              ${SEL('rv'+rt.id,rt.verifier||'',[{v:'',l:'— поверитель не назначен —'},
                ...crew.map(p=>({v:p.id,l:p.name,hint:S.routes.filter(x=>x.date===ds&&x.verifier===p.id).length+' марш.'}))],
                v=>rcAssign(rt.id,v),{sm:true})}</div>
            <div class="rcs">${rt.stops.map((s,i)=>{const r=S.requests.find(x=>x.id===s.req); if(!r) return '';
              return `<div><span class="n mono">${pad(i+1)}</span>
                <span class="a">${esc(r.city)}, ${esc(r.street)}, ${r.house}</span>

          </div>`).join('')

        </div>
      </div>
    </div></div>`;
}

/* ---------- список маршрутов ---------- */
function viewRoutes(){
  const from = iso(addDays(today,-3));
  const list = S.routes.filter(r=>r.date>=from).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  const older = S.routes.length - list.length;
  const byDay = {}; list.forEach(rt=>(byDay[rt.date] ||= []).push(rt));
  return shell(null,`${cap()}
  <div class="row" style="margin-bottom:14px;align-items:center">

function build(ds,city){
  const pool = poolOf(ds,city), made=[];
  for(let i=0;i<pool.length;i+=25){
    const chunk = pool.slice(i,i+25), id='M'+(++S.seq);
    chunk.forEach(r=>{r.routeId=id;r.status='в маршруте';});
    const rt = {id,date:ds,city,verifier:null,status:'черновик',
      stops:chunk.map(r=>({req:r.id,called:null,done:false})),chat:[],duty:null};
    S.routes.push(rt); made.push(rt);
  }
  return made;
}
