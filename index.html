function callStop(id,i,res){
  const rt = S.routes.find(r=>r.id===id); rt.stops[i].called = res;
  if(res!=='подтверждена'){const r=S.requests.find(x=>x.id===rt.stops[i].req); if(r) r.status = res==='отказ'?'отменена':'перенос';}
  render();
}
function move(id,i,d){ const st=S.routes.find(r=>r.id===id).stops; [st[i],st[i+d]]=[st[i+d],st[i]]; render(); }
function setStatus(id,st){
  const rt = S.routes.find(r=>r.id===id); rt.status = st;
  if(st==='выполнен') rt.stops.forEach(s=>{const r=S.requests.find(x=>x.id===s.req);
    if(r&&s.called==='подтверждена'){s.done=true;r.status='выполнена';r.verifier=rt.verifier;}});
  toast(st==='выполнен'?'Маршрут закрыт. Работы ушли в реестр УК и в расчёт сдельной оплаты.':'Маршрут обзвонен и готов к выдаче поверителю.');
}
function send(id){
  const el = document.getElementById('chatin'), t = el.value.trim(); if(!t) return;
  const rt = S.routes.find(r=>r.id===id);
  rt.chat.push({who:S.user,vf:S.role==='verifier',txt:t,t:new Date().toTimeString().slice(0,5)});
  render();
}

function viewPayroll(){

function viewMyRoute(){
  const mine = S.routes.filter(r=>r.verifier===S.me).sort((a,b)=>b.date.localeCompare(a.date));
  const rt = S.routes.find(r=>r.id===S.openRoute) || mine.find(r=>r.date===TODAY) || mine[0];
  const side = `<div class="lbl" style="padding:6px 10px 8px">Мои маршруты</div>

      <span><span class="mono" style="font-size:12px">${ru(r.date)}</span>

    :`<p class="note" style="padding:8px 10px">Маршрутов не назначено.</p>`}`;
  if(!rt) return shell(side,`${cap()}<div class="c"><div class="empty">Маршрут не назначен.</div></div>`);

    || rt.stops.find(s=>s.called==='подтверждена'&&!s.done) || rt.stops[0];
  return shell(side, `${cap()}${routeCard(rt)}${stop?workSheet(rt,stop):''}`);

/* ---------- акт выполненных работ ---------- */
function workSheet(rt,s){
  const r = S.requests.find(x=>x.id===s.req); if(!r) return '';
  const i0 = rt.stops.indexOf(s);
  r.devices.forEach(d=>{ if(!d.photos) d.photos=[]; });
  const noPh = r.devices.some(d=>!d.photos.length);
  return `<div class="c" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px">
      <div><h3>Акт · точка ${pad(i0+1)} · ${esc(addrOf(r))}</h3>
        <div class="mono" style="font-size:11px;color:var(--ink3);margin-top:3px">${r.id} · ${esc(r.name)} · эт. ${r.floor||'—'} · ${r.intercom?'домофон работает':'домофон не работает'} · окно ${pad(r.time-1)}:00–${pad(r.time+1)}:00</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        ${s.done?'<span class="tg t-ok">позиция закрыта</span>':'<span class="tg t-mut">в работе</span>'}
        <button class="g sm" onclick="startCall('${esc(r.phone)}','основной','${esc(r.name)}')">${svg(I.phone,12)}Клиент</button></div>
    </div>
    <p class="cap">Услуга выбирается в строке прибора. К каждому прибору — фото выполненных работ, несколько кадров.</p>
    ${r.cmtVf?`<div class="actnote"><b>Комментарий для поверителей</b>${esc(r.cmtVf)}</div>`:''}
    ${r.devices.map((d,i)=>`<div class="wrow ${d.photos.length?'':'new'}">
      <div class="wtop">
        ${SEL('wS'+i,d.svc,SERVICES.map(x=>({v:x.id,l:x.name,hint:x.grp})),v=>{d.svc=v;},{sm:true,ph:'Услуга'})}
        ${SEL('wT'+i,d.type,DEV_TYPES.map(t=>({v:t.v,l:t.v,hint:t.grsi})),v=>{d.type=v;d.grsi=DEV_TYPES.find(t=>t.v===v).grsi;},{sm:true})}
        ${SEL('wC'+i,d.carrier,['ХВС','ГВС','Тепло'],v=>{d.carrier=v;},{sm:true})}
        <input class="fld sm mono" value="${esc(d.serial)}" oninput="setDev('${r.id}',${i},'serial',this.value)" placeholder="Заводской №">
        ${SEL('wR'+i,d.room,ROOMS,v=>{d.room=v;},{sm:true})}
        ${CHK(d.seal,'пломба УК',`setDev('${r.id}',${i},'seal',${!d.seal})`)}
        <button class="ib sm no" title="Убрать прибор" onclick="rmDev('${r.id}',${i})">${svg(I.no,13)}</button>
      </div>
      <div class="wbot"><span class="lbl">Фото работ</span>
        ${d.photos.map((p,k)=>`<span class="phw"><img src="${p.src}" alt="${esc(p.name)}" title="${esc(p.name)} · ${esc(p.t)}" onclick="lbOpen('${r.id}',${i},${k})">
          <button class="x" title="Удалить кадр" onclick="rmPhoto('${r.id}',${i},${k})">${svg(I.no,9)}</button></span>`).join('')}
        <input type="file" id="ph${r.id}_${i}" accept="image/*" multiple style="display:none" onchange="addPhotos('${r.id}',${i},this)">
        <label class="g sm addph" for="ph${r.id}_${i}">${svg(I.cam,12)}Добавить фото</label>
        ${d.photos.length?`<span class="note">${d.photos.length} кадр(ов)</span>`:'<span class="nophoto">нет фото</span>'}
      </div></div>`).join('')}
    <button class="g sm" onclick="addDev('${r.id}')">${svg(I.plus,12)}Добавить прибор</button>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <span class="note">${r.devices.length?`По прайсу ${r.clientType.toLowerCase()} <b class="mono" style="color:var(--ink)">${money(priceOf(r))}</b> · вам начислится <b class="mono" style="color:var(--ink)">${money(rateV(r))}</b> · оператору <b class="mono" style="color:var(--ink)">${money(rateO(r))}</b>${noPh?' · <span style="color:var(--error)">есть приборы без фото</span>':''}`
        :'Приборов в акте нет. Добавьте то, что фактически обслужили на адресе.'}</span>
      ${s.done?`<button class="g" onclick="reopenStop('${rt.id}',${i0})">Вернуть в работу</button>`
        :`<button class="b" onclick="closeStop('${rt.id}',${i0})" ${r.devices.length?'':'disabled'}>Закрыть позицию</button>`}</div>
  </div>`;
}
function setDev(rid,i,k,v){ const r=S.requests.find(x=>x.id===rid); r.devices[i][k]=v; render(); }
function addDev(rid){
  const r = S.requests.find(x=>x.id===rid);
  r.devices.push({svc:'wv',type:DEV_TYPES[0].v,grsi:DEV_TYPES[0].grsi,carrier:'ХВС',serial:'',room:'Кухня',seal:false,photos:[]});
  render();
}
function rmDev(rid,i){ const r=S.requests.find(x=>x.id===rid); r.devices.splice(i,1); render(); }
function rmPhoto(rid,i,k){ const r=S.requests.find(x=>x.id===rid); r.devices[i].photos.splice(k,1); S.lb=null; render(); }
function addPhotos(rid,i,el){
  const list = [...el.files].slice(0,8); if(!list.length) return;
  let left = list.length;
  list.forEach(f=>{
    const rd = new FileReader();
    const done = () => { if(!--left){ el.value=''; render(); } };
    rd.onload = () => { const r=S.requests.find(x=>x.id===rid);
      if(r) r.devices[i].photos.push({src:rd.result,name:f.name,t:new Date().toTimeString().slice(0,5)}); done(); };
    rd.onerror = done;
    rd.readAsDataURL(f);
  });
}
function closeStop(id,i){
  const rt = S.routes.find(r=>r.id===id), s = rt.stops[i], r = S.requests.find(x=>x.id===s.req);
  if(!r.devices.length) return toast('В акте нет приборов — закрывать нечего.');
  if(r.devices.some(d=>!d.svc)) return toast('В каждой строке прибора выберите услугу.');
  if(r.devices.some(d=>!String(d.serial).trim())) return toast('Заполните заводские номера приборов — они уходят в реестр УК.');
  const noPh = r.devices.filter(d=>!d.photos.length).length;
  const noSeal = r.devices.filter(d=>!d.seal).length;
  s.done = true; s.called = s.called || 'подтверждена';
  r.status = 'выполнена'; r.verifier = rt.verifier; r.services = [...new Set(worksOf(r))];
  if(rt.status==='обзвонен'||rt.status==='черновик') rt.status='в работе';
  toast(`Позиция закрыта: ${r.devices.length} прибор(ов) на ${money(priceOf(r))}, вам начислено ${money(rateV(r))}.`
    + (noPh?` Без фото: ${noPh} — оператор увидит подсветку.`:'')
    + (noSeal?` Без пломбы УК: ${noSeal} — в отчёт УК не пойдут.`:''));
}
function reopenStop(id,i){
  const rt = S.routes.find(r=>r.id===id), s = rt.stops[i], r = S.requests.find(x=>x.id===s.req);
  s.done = false; r.status = 'в маршруте'; r.verifier = null;
  toast('Позиция вернулась в работу. Начисления по ней сняты до повторного закрытия.');
}

/* ============================================================ */
const VIEWS = {intake:viewIntake,support:viewSupport,me:viewMe,
  plan:viewPlan,routes:viewRoutes,schedule:viewSchedule,payroll:viewPayroll,
  services:viewServices,myroute:viewMyRoute,absence:viewAbsence};
/* Навигация идёт по индексу страницы: одна и та же страница может встречаться
   в разных ролевых группах и показывать разное (например «Отсутствия»). */
function goPage(n){
  const p = PAGES[(n+PAGES.length)%PAGES.length];
  S.page = (n+PAGES.length)%PAGES.length;
  S.view = p.v; S.role = p.role; S.me = ROLES[p.role].id; S.user = ROLES[p.role].who;
  S.dd = null; S.openStop = null; S.modal = null; S.edit = null;
  /* Открываем конкретный маршрут: общий режим на 200 точек тяжело перерисовывать. */
  if(p.v==='support') S.openRoute = routesToday()[0]?.id || null;
  if(p.v==='myroute') S.openRoute = null;
  render();
}
function step(d){ goPage(S.page+d); }
function go(v){
  const here = PAGES.findIndex(p=>p.v===v && p.role===S.role);
  goPage(here>=0?here:Math.max(0,PAGES.findIndex(p=>p.v===v)));
}
/* Перерисовка целиком, поэтому фокус и каретку в поле возвращаем руками:
   входящий звонок может прийти, пока оператор печатает адрес. */
function render(){
  const a = document.activeElement;
  const id = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
  document.getElementById('root').innerHTML = S.auth?(VIEWS[S.view]||viewIntake)():viewLogin();
  if(!id) return;
  const el = document.getElementById(id);
  if(!el || typeof el.focus!=='function') return;
  el.focus();
  if(ss!=null && typeof el.setSelectionRange==='function'){ try{ el.setSelectionRange(ss,se); }catch(e){} }
}

if(typeof document==='object' && document && document.addEventListener){
  document.addEventListener('click',e=>{ if(S.dd && !e.target.closest('[data-fld]')){ S.dd=null; render(); } });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(S.dd){ S.dd=null; render(); return; }
      if(S.lb){ S.lb=null; render(); return; }
      if(S.modal){ closeModal(); return; }
    }
    if(!S.auth) return;
    if(S.lb && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); lbMove(e.key==='ArrowRight'?1:-1); return; }
    if(e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); step(e.key==='ArrowRight'?1:-1); }
  });
}
seed();
render();
if(typeof setInterval==='function') setInterval(opTick,1000);
if(typeof INTRO!=='undefined' && typeof document==='object' && document.getElementById)
  INTRO.start(()=>{ S.introDone=true; });
</script>
